<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 编辑器</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#202124;background:#f1f3f5}*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;min-height:0;padding:14px;overflow:hidden}.card{height:100%;width:100%;margin:0;min-height:0}main{height:100%;min-height:0}.workspace{height:100%;min-height:0;display:grid;grid-template-columns:245px minmax(0,1fr) 285px;gap:14px}.files,.preview-box,.settings{min-height:0;max-height:100%;overflow:hidden}.files{overflow-y:auto}.settings{overflow-y:auto}.preview-box{overflow:hidden}.preview{flex:1;min-height:0;overflow-y:auto}.files,.preview-box,.settings{min-height:0;border:1px solid #e0e3e6;border-radius:11px;padding:12px}.files{overflow:auto;background:#fafbfc;display:flex;flex-direction:column;gap:12px}.upload{border:2px dashed #c8cdd2;border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;background:#fff;flex:none}.upload.drag{border-color:#477be1;background:#f1f5ff}.upload strong{display:block;margin-bottom:5px;font-size:13px}.hint,.help{font-size:12px;color:#777}input[type=file]{display:none}.memory{padding:10px;border-radius:8px;background:#f0f3f6;font-size:12px;line-height:1.6}.memory-bar{height:5px;background:#dce1e6;border-radius:5px;overflow:hidden;margin-top:7px}.memory-bar i{display:block;height:100%;background:#377bd4;width:0%;transition:width .2s}.file-list{min-height:0;overflow:auto}.files h3,.preview-head,.setting h3{margin:0 0 10px;font-size:14px}.file-entry{display:flex;align-items:center;gap:7px;padding:9px 5px;border-bottom:1px solid #e7e9eb;font-size:12px}.file-entry span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.preview-box{background:#eef0f2;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;align-items:center;flex:none}.preview{min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));align-content:start;gap:10px}.thumb{position:relative;border:2px solid transparent;border-radius:7px;background:#fff;cursor:pointer;padding:3px}.thumb.selected{border-color:#2b73d2}.thumb img{width:100%;display:block;min-height:150px;object-fit:contain;background:#fff}.thumb span{display:block;text-align:center;padding:4px 0;font-size:12px}.thumb input{position:absolute;top:7px;left:7px;width:16px;height:16px;accent-color:#2b73d2}.zoom{position:absolute;top:6px;right:6px;width:25px;height:25px;border:0;border-radius:50%;background:#ffffffe8;cursor:zoom-in}.settings{display:flex;flex-direction:column;gap:10px;overflow:auto}.setting{position:relative;border:1px solid #e0e3e6;border-radius:9px;padding:12px}.setting h3{margin-bottom:9px}.setting.changed h3:after{content:"";width:7px;height:7px;background:#e33;border-radius:50%;display:inline-block;margin-left:7px}.setting select,.setting input{width:100%;border:1px solid #d4d8dc;border-radius:7px;padding:9px;font:inherit;background:#fff}.actions{margin-top:auto}.primary,.download{width:100%;padding:11px;border:0;border-radius:8px;background:#222;color:#fff;font:inherit;cursor:pointer}.download{display:none;background:#2878d8;margin-top:8px}.download.show{display:block}.status{text-align:center;min-height:22px;margin:7px 0;color:#666;font-size:13px}.status.ok{color:#198754}.status.error{color:#c33}.remove{border:0;background:none;font-size:20px;color:#777;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:5;place-items:center}.modal.show{display:grid}.modal img{max-width:90vw;max-height:88vh;background:#fff}.modal button{position:fixed;top:20px;right:25px;border:0;background:#fff;border-radius:50%;font-size:24px;width:38px;height:38px;cursor:pointer}@media(max-width:900px){body{height:100vh;height:100dvh;min-height:0;overflow:hidden;padding:8px}.workspace{height:100%;min-height:0;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(110px,24%) minmax(0,1fr) minmax(155px,30%);gap:8px}.files{max-height:100%;padding:9px;gap:7px}.files h3{margin-bottom:4px}.preview-box{min-height:0;padding:9px}.preview{height:auto;min-height:0}.settings{max-height:100%;padding:9px;gap:7px}.setting{padding:8px}.actions{margin-top:0}}
</style></head><body><main><section class="workspace">
<aside class="files"><div class="upload" id="uploadArea"><strong>点击或拖拽上传 PDF</strong><span class="hint">支持多选 · 单个/总计最大 500 MB</span><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple></div><div class="memory"><b>已占用空间</b><br><span id="memoryText">0 B / 500 MB</span><div class="memory-bar"><i id="memoryBar"></i></div></div><h3>已上传文件</h3><div class="file-list" id="fileList"><div class="hint">暂无文件</div></div></aside>
<div class="preview-box"><div class="preview-head"><span>页面预览</span><span id="pageCount">共 0 页</span></div><div class="preview" id="preview"><div class="help">请从左侧上传 PDF 文件</div></div><div class="help" style="margin-top:8px;flex:none">点击缩略图选择/取消；拖动缩略图可调整顺序。</div></div>
<div class="settings"><div class="setting" id="sizeSetting"><h3>页面大小</h3><select id="pageSize"><option value="original">原始大小（不修改）</option><option value="A4">A4（210 × 297 mm）</option><option value="A3">A3（297 × 420 mm）</option></select></div><div class="setting" id="pagesSetting"><h3>保留页面</h3><input id="pages" placeholder="不修改；例如 1 3-5"><div class="help">留空表示保留全部页面。</div></div><div class="setting" id="compressSetting"><h3>压缩 PDF</h3><select id="quality"><option value="none">不压缩</option><option value="/printer">高质量（打印）</option><option value="/ebook">平衡（电子书）</option><option value="/screen">较小（屏幕）</option></select></div><div class="actions"><button class="primary" id="processBtn">应用设置并准备下载</button><div class="status" id="status"></div><button class="download" id="downloadBtn">下载处理后的 PDF</button></div></div></section></main><div class="modal" id="modal"><button id="closeModal">×</button><img id="largeImage"></div>
<script>
let fileId=null,totalPages=0,selectedPages=[],pageOrder=[],uploadedFiles=[],usedBytes=0;const $=id=>document.getElementById(id),area=$('uploadArea');
area.onclick=()=>$('fileInput').click();area.ondragover=e=>{e.preventDefault();area.classList.add('drag')};area.ondragleave=()=>area.classList.remove('drag');area.ondrop=e=>{e.preventDefault();area.classList.remove('drag');if(e.dataTransfer.files.length)choose([...e.dataTransfer.files])};$('fileInput').onchange=e=>{if(e.target.files.length)choose([...e.target.files])};
function choose(files){if(files.some(f=>f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')))return show('error','只能上传 PDF 文件');if(files.some(f=>f.size>524288000))return show('error','单个文件不能超过 500 MB');if(usedBytes+files.reduce((a,f)=>a+f.size,0)>524288000)return show('error','上传文件总大小不能超过 500 MB');upload(files)}
async function upload(files){const fd=new FormData();files.forEach(f=>fd.append('files',f));if(fileId)fd.append('file_id',fileId);try{const r=await fetch('/upload',{method:'POST',body:fd}),d=await r.json();if(!d.success)throw Error(d.error);fileId=d.file_id;totalPages=d.pages;selectedPages=Array.from({length:totalPages},(_,i)=>i+1);pageOrder=[...selectedPages];uploadedFiles=d.names;usedBytes=d.upload_bytes;updateMemory();renderFileList();$('pageCount').textContent=`共 ${totalPages} 页`;$('pages').value='';$('downloadBtn').classList.remove('show');render();markChanged()}catch(e){show('error','上传失败：'+e.message)}}
function renderFileList(){$('fileList').innerHTML=uploadedFiles.length?uploadedFiles.map((name,index)=>`<div class="file-entry"><b>${index+1}</b><span title="${name}">${name}</span></div>`).join(''):'<div class="hint">暂无文件</div>'}
function updateMemory(){const mb=usedBytes/1048576;$('memoryText').textContent=`${mb<1?usedBytes+' B':mb.toFixed(2)+' MB'} / 500 MB`;$('memoryBar').style.width=Math.min(100,usedBytes/524288000*100)+'%'}
function render(){const box=$('preview');box.innerHTML='';pageOrder.forEach(n=>{const chosen=selectedPages.includes(n),el=document.createElement('div');el.className='thumb '+(chosen?'selected':'');el.draggable=true;el.innerHTML=`${chosen?'<input type="checkbox" checked>':''}<button class="zoom" title="放大查看">⌕</button><img loading="lazy" src="/preview/${fileId}/${n}"><span>第 ${n} 页</span>`;el.onclick=e=>{if(e.target.classList.contains('zoom')||e.target.tagName==='INPUT')return;toggle(n)};if(chosen)el.querySelector('input').onchange=()=>toggle(n);el.querySelector('.zoom').onclick=e=>{e.stopPropagation();$('largeImage').src=`/preview/${fileId}/${n}`;$('modal').classList.add('show')};el.ondragstart=e=>e.dataTransfer.setData('text/plain',n);el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();const from=pageOrder.indexOf(+e.dataTransfer.getData('text/plain')),to=pageOrder.indexOf(n);if(from<0||to<0)return;const [m]=pageOrder.splice(from,1);pageOrder.splice(to,0,m);render();markChanged()};box.appendChild(el)});$('pageCount').textContent=`显示 ${selectedPages.length} / ${totalPages} 页`}
function toggle(n){if(selectedPages.includes(n))selectedPages=selectedPages.filter(x=>x!==n);else selectedPages.push(n);syncPages();render();markChanged()}function parseLocal(v){if(!v.trim())return [...pageOrder];const out=[];for(const t of v.split(/[\s,，;；]+/)){if(!t)continue;const m=t.match(/^(\d+)(?:-(\d+))?$/);if(!m)return null;const a=+m[1],b=+(m[2]||m[1]);if(a<1||b>totalPages||a>b)return null;for(let i=a;i<=b;i++)if(!out.includes(i))out.push(i)}return out}function formatPageRanges(pages){const sorted=[...new Set(pages)].sort((a,b)=>a-b);const ranges=[];for(let i=0;i<sorted.length;){let start=sorted[i],end=start;while(i+1<sorted.length&&sorted[i+1]===end+1){end=sorted[++i]}ranges.push(start===end?String(start):`${start}-${end}`);i++}return ranges.join(' ')}function syncPages(){$('pages').value=selectedPages.length===totalPages?'':formatPageRanges(selectedPages)}$('pages').oninput=()=>{const p=parseLocal($('pages').value);if(p){selectedPages=p;render()}markChanged()};$('pageSize').onchange=markChanged;$('quality').onchange=markChanged;function markChanged(){$('sizeSetting').classList.toggle('changed',$('pageSize').value!=='original');$('pagesSetting').classList.toggle('changed',$('pages').value.trim()!==''&&selectedPages.length!==totalPages);$('compressSetting').classList.toggle('changed',$('quality').value!=='none')}
$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};$('processBtn').onclick=async()=>{if(!fileId)return show('error','请先上传 PDF');const p=parseLocal($('pages').value);if(!p||!p.length)return show('error','至少保留一页，且页码格式正确');const fd=new FormData();fd.append('file_id',fileId);fd.append('page_size',$('pageSize').value);fd.append('pages',$('pages').value);fd.append('profile',$('quality').value);fd.append('order',JSON.stringify(pageOrder));const b=$('processBtn');b.disabled=true;show('','正在合并处理…');try{const r=await fetch('/process',{method:'POST',body:fd}),d=await r.json();if(!d.success)throw Error(d.error);$('downloadBtn').classList.add('show');show('ok','处理完成，点击一次下载')}catch(e){show('error',e.message)}finally{b.disabled=false}};$('downloadBtn').onclick=()=>location.href='/download/'+fileId;function show(c,t){$('status').className='status '+c;$('status').textContent=t}
</script></body></html>
