<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Merge, organize, and resize PDF pages locally in your browser."><title>PDF Editor</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2937;background:#f7f9fc}body.dark{color:#e5e7eb;background:#111827}body.dark .files,body.dark .preview-box,body.dark .settings,body.dark .startup-card{background:#1f2937;border-color:#374151;color:#e5e7eb}body.dark .preview-box{background:#111827}body.dark .memory{background:#111827}body.dark .setting select,body.dark .setting input,body.dark .download-name{background:#111827;color:#e5e7eb;border-color:#4b5563}.appbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;height:30px;margin-bottom:10px}.brand{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;line-height:1;letter-spacing:.01em;color:#374151}.brand:before{content:'';width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,#5b9df5,#377bd4);box-shadow:0 1px 3px #377bd440}.appbar-tools{display:flex;align-items:center;gap:8px}.seg{--seg-off:#6f7b8d;--seg-on:#fff;--seg-track:#e9eef6;--seg-border:#d8e1ee;--seg-hover:#c3d3ea;--seg-ring:#bfdbfe;position:relative;display:inline-flex;flex:none;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.seg input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}.seg-track{position:relative;display:inline-flex;align-items:center;padding:3px;border:1px solid var(--seg-border);border-radius:999px;background:var(--seg-track);transition:background .25s,border-color .25s,box-shadow .25s}.seg-opt{position:relative;z-index:2;display:grid;place-items:center;width:26px;height:19px;font-size:11px;font-weight:600;line-height:1;color:var(--seg-off);transition:color .25s}.seg-opt:first-of-type{color:var(--seg-on)}.seg-opt svg{display:block;width:14px;height:14px}.seg input:checked~.seg-track .seg-opt:first-of-type{color:var(--seg-off)}.seg input:checked~.seg-track .seg-opt:last-of-type{color:var(--seg-on)}.seg-thumb{position:absolute;z-index:1;left:3px;top:3px;width:26px;height:19px;border-radius:999px;background:linear-gradient(180deg,#4f92f2,#3573cf);box-shadow:0 1px 2px #1f3d6b33,0 3px 8px #377bd440;transition:transform .28s cubic-bezier(.4,1.15,.5,1)}.seg input:checked~.seg-track .seg-thumb{transform:translateX(26px)}.seg:hover .seg-track{border-color:var(--seg-hover)}.seg input:focus-visible~.seg-track{outline:3px solid var(--seg-ring);outline-offset:2px}body.dark .seg{--seg-off:#9aa8ba;--seg-track:#293546;--seg-border:#41506a;--seg-hover:#54637c;--seg-ring:#2563eb}body.dark .brand{color:#e5e7eb}*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;padding:16px;overflow:hidden;display:flex;flex-direction:column}main{flex:1;min-height:0}.workspace{height:100%;display:grid;grid-template-columns:245px minmax(0,1fr) 285px;gap:16px}.files,.preview-box,.settings{min-height:0;border:1px solid #e5e7eb;border-radius:14px;padding:14px;overflow:hidden;background:#fff;box-shadow:0 4px 18px #1f29370d}.files{overflow:auto;display:flex;flex-direction:column;gap:12px}.settings{overflow-y:auto}.upload{border:2px dashed #8eb5f5;border-radius:12px;padding:24px 12px;text-align:center;cursor:pointer;background:#f7faff;box-shadow:inset 0 0 0 1px #fff;transition:.2s}.upload:hover,.upload.drag{border-color:#377bd4;background:#edf4ff;box-shadow:0 5px 18px #377bd41f}.upload strong{display:block;margin-bottom:5px;font-size:13px;color:#2458a6}body.dark .upload{border-color:#3b5a86;background:#16202e;box-shadow:inset 0 0 0 1px #ffffff08}body.dark .upload:hover,body.dark .upload.drag{border-color:#5590e0;background:#1b2a3d;box-shadow:0 5px 18px #00000040}body.dark .upload strong{color:#8ab4f8}.hint,.help{font-size:12px;color:#6b7280}input[type=file]{display:none}.memory{padding:11px;border-radius:9px;background:#f8fafc;font-size:12px;line-height:1.6}.memory-bar,.upload-progress{height:5px;background:#e5e7eb;border-radius:5px;overflow:hidden;margin-top:7px}.memory-bar i,.upload-progress i{display:block;height:100%;background:#377bd4;width:0;transition:width .15s ease}.upload-progress{height:6px;margin-top:8px}.file-list{overflow:auto}.files h3,.preview-head,.setting h3{margin:0 0 10px;font-size:14px}.file-entry{display:flex;align-items:center;gap:7px;padding:9px 5px;border-bottom:1px solid #eef0f3;font-size:12px}.file-entry span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}.file-remove{flex:none;width:24px;height:24px;border:0;border-radius:5px;background:#fff0f0;color:#b3261e;padding:0;cursor:pointer;font-size:18px;line-height:22px}.file-remove:hover{background:#ffe0e0}.preview-box{background:#f8fafc;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;flex:none}.preview{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));align-content:start;gap:10px}.thumb{position:relative;border:2px solid transparent;border-radius:9px;background:#fff;padding:6px;text-align:center;cursor:grab;font-size:12px;overflow-wrap:anywhere;box-shadow:0 2px 8px #1f29370d}.thumb.selected{border-color:#477be1}.thumb img{display:block;width:100%;height:190px;object-fit:contain;background:#f8f8f8}.thumb input{position:absolute;left:10px;top:10px;z-index:1}.zoom{position:absolute;right:10px;top:8px}.setting{padding:12px 0;border-bottom:1px solid #eef0f3}.setting select,.setting input:not([type=checkbox]){width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;background:#fff}.changed h3:after{content:' · Modified';color:#377bd4;font-size:11px}.switch-row,.range-label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}.switch-row{position:relative;justify-content:flex-start;min-height:34px;padding-right:52px}.switch-row input{position:absolute;right:0;width:44px;height:24px;margin:0;opacity:0;cursor:pointer;z-index:2}.switch-ui{position:absolute;right:0;width:44px;height:24px;border-radius:20px;background:#cbd5e1;transition:.2s}.switch-ui:after{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:white;box-shadow:0 1px 3px #0003;transition:.2s}.switch-row input:checked+.switch-ui{background:#377bd4}.switch-row input:checked+.switch-ui:after{transform:translateX(20px)}.switch-row input:focus-visible+.switch-ui{outline:3px solid #93c5fd}.range-label{margin-top:12px}#compressionRatio{width:100%;accent-color:#377bd4;margin:10px 0 0}.range-scale{display:flex;justify-content:space-between;color:#6b7280;font-size:11px}.startup-loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#f7f9fc}.startup-card{width:min(340px,calc(100vw - 40px));padding:28px 24px;text-align:center;border:1px solid #e5e7eb;border-radius:16px;background:#fff;box-shadow:0 8px 30px #1f293714}.startup-card h1{margin:12px 0 4px;font-size:20px}.startup-card p{margin:0 0 16px;color:#6b7280;font-size:13px}.startup-spinner{width:30px;height:30px;margin:auto;border:3px solid #dbeafe;border-top-color:#377bd4;border-radius:50%;animation:spin .8s linear infinite}.startup-track{height:7px;overflow:hidden;border-radius:8px;background:#e5e7eb}.startup-track i{display:block;width:0;height:100%;border-radius:inherit;background:#377bd4;transition:width .25s ease}.startup-card span{display:block;margin-top:8px;color:#6b7280;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}.download-name-label{display:block;margin-top:12px;margin-bottom:5px;font-size:12px;color:#6b7280}.download-name{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:7px;background:#fff;color:#1f2937}.actions{padding-top:14px}button{font:inherit}.primary,.download{width:100%;padding:10px;border:0;border-radius:8px;cursor:pointer}.primary{background:#377bd4;color:#fff}.download{display:none;margin-top:9px;background:#24834d;color:#fff}.download.show{display:block}.status{min-height:20px;margin-top:9px;font-size:12px}.status.error{color:#c62828}.status.ok{color:#168044}.compression-progress{margin-top:8px;padding:9px 10px;border-radius:8px;background:#f3f7fc;font-size:12px;color:#4b5563}.compression-progress[hidden]{display:none}.compression-progress-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.compression-progress-track{height:6px;border-radius:8px;background:#e1e8f0;overflow:hidden}.compression-progress-track i{display:block;width:0;height:100%;border-radius:inherit;background:#377bd4;transition:width .18s ease}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:30px}.modal.show{display:flex}.modal img{max-width:96vw;max-height:92vh;width:auto;height:auto;background:#fff;image-rendering:auto}.modal button{position:absolute;right:20px;top:12px;font-size:30px;background:none;border:0;color:#fff}@media(max-width:850px){body{height:auto;min-height:100vh;overflow:auto;padding:10px}.appbar{position:sticky;top:0;z-index:12;height:34px;margin:0 -2px 8px;padding:0 2px;background:rgba(247,249,252,.92);backdrop-filter:blur(8px)}body.dark .appbar{background:rgba(17,24,39,.9)}.workspace{height:auto;display:flex;flex-direction:column;gap:12px}.files{max-height:none}.preview-box{height:auto;min-height:0}.preview{flex:none;display:flex;flex-direction:row;align-items:flex-start;overflow-x:auto;overflow-y:hidden;gap:10px;padding:3px 2px 10px;scroll-snap-type:x proximity}.thumb{flex:0 0 145px;width:145px;scroll-snap-align:start}.settings{max-height:none}}
</style></head><body><header class="appbar"><span class="brand">PDF Editor</span><div class="appbar-tools"><label class="seg" title="浅色 / 深色"><input id="themeToggle" type="checkbox" role="switch" aria-label="Dark theme"><span class="seg-track"><span class="seg-opt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg></span><span class="seg-opt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></span><i class="seg-thumb" aria-hidden="true"></i></span></label><label class="seg" title="English / 中文"><input id="languageToggle" type="checkbox" role="switch" aria-label="Switch language"><span class="seg-track"><span class="seg-opt">EN</span><span class="seg-opt">中</span><i class="seg-thumb" aria-hidden="true"></i></span></label></div></header>
<div id="startupLoader" class="startup-loader" role="status" aria-live="polite"><div class="startup-card"><div class="startup-spinner"></div><h1>PDF Editor</h1><p id="startupText">Loading resources…</p><div class="startup-track"><i id="startupBar"></i></div><span id="startupPercent">0%</span></div></div><main id="appShell" hidden><section class="workspace"><aside class="files"><div class="upload" id="uploadArea"><strong>Click or drag PDF files here</strong><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple></div><div class="memory" id="loadStatus" role="status"><span id="loadStatusText">Waiting…</span><div class="upload-progress" aria-hidden="true"><i id="uploadProgressBar"></i></div></div><div class="memory"><b>Selected file size</b><br><span id="memoryText">0 B / 500 MB</span><div class="memory-bar"><i id="memoryBar"></i></div></div><h3>Uploaded files</h3><div class="file-list" id="fileList"><div class="hint">No files</div></div></aside><div class="preview-box"><div class="preview-head"><span></span><span id="pageCount">0 pages</span></div><div class="preview" id="preview"></div><div class="help" style="margin-top:8px;flex:none">Click thumbnails to select or deselect; drag to reorder.</div></div><div class="settings"><div class="setting" id="sizeSetting"><h3>Page size</h3><select id="pageSize"><option value="original">Original size</option><option value="A4">A4 (210 × 297 mm)</option><option value="A3">A3 (297 × 420 mm)</option></select></div><div class="setting" id="pagesSetting"><h3>Keep pages</h3><input id="pages" placeholder="e.g. 1 3-5"></div><div class="setting" id="compressSetting"><h3>Compress PDF</h3><label class="switch-row"><span>Compression</span><input id="compressionEnabled" type="checkbox" role="switch"><span class="switch-ui" aria-hidden="true"></span></label><div id="compressionOptions" hidden><label class="range-label" for="compressionRatio"><span>Image compression</span><output id="compressionRatioValue" for="compressionRatio">70%</output></label><input id="compressionRatio" type="range" min="10" max="95" step="5" value="70"><div class="range-scale"><span>Smaller file</span><span>Higher quality</span></div></div></div><div class="actions"><button class="primary" id="processBtn">Apply Settings</button><label class="download-name-label" for="downloadName">File name</label><input id="downloadName" class="download-name" type="text" value="edited.pdf" spellcheck="false"><div class="status" id="status"></div><div class="compression-progress" id="compressionProgress" hidden role="status" aria-live="polite"><div class="compression-progress-head"><span id="compressionProgressLabel">Compressing PDF</span><span id="compressionProgressCount">0/0</span></div><div class="compression-progress-track"><i id="compressionProgressBar"></i></div></div><button class="download" id="downloadBtn">Download processed PDF</button></div></div></section></main><div class="modal" id="modal"><button id="closeModal">×</button><img id="largeImage"></div>
<script type="module" src="./src/main.js"></script></body></html>
