<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Merge, organize, and resize PDF pages locally in your browser."><title>PDF Editor</title></head><body>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#202124;background:#f1f3f5}*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;padding:14px;overflow:hidden}main{height:100%}.workspace{height:100%;display:grid;grid-template-columns:245px minmax(0,1fr) 285px;gap:14px}.files,.preview-box,.settings{min-height:0;border:1px solid #e0e3e6;border-radius:11px;padding:12px;overflow:hidden}.files{overflow:auto;background:#fafbfc;display:flex;flex-direction:column;gap:12px}.settings{overflow-y:auto}.upload{border:2px dashed #c8cdd2;border-radius:10px;padding:18px 10px;text-align:center;cursor:pointer;background:white}.upload.drag{border-color:#477be1}.upload strong{display:block;margin-bottom:5px;font-size:13px}.hint,.help{font-size:12px;color:#777}input[type=file]{display:none}.memory{padding:10px;border-radius:8px;background:#f0f3f6;font-size:12px;line-height:1.6}.memory-bar,.upload-progress{height:5px;background:#dce1e6;border-radius:5px;overflow:hidden;margin-top:7px}.memory-bar i,.upload-progress i{display:block;height:100%;background:#377bd4;width:0;transition:width .15s ease}.upload-progress{height:6px;margin-top:8px}.file-list{overflow:auto}.files h3,.preview-head,.setting h3{margin:0 0 10px;font-size:14px}.file-entry{display:flex;align-items:center;gap:7px;padding:9px 5px;border-bottom:1px solid #e7e9eb;font-size:12px}.file-entry span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}.file-remove{flex:none;width:24px;height:24px;border:0;border-radius:5px;background:#fff0f0;color:#b3261e;padding:0;cursor:pointer;font-size:18px;line-height:22px}.file-remove:hover{background:#ffe0e0}.file-remove:hover{background:#ffe0e0}.preview-box{background:#eef0f2;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;flex:none}.preview{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));align-content:start;gap:10px}.thumb{position:relative;border:2px solid transparent;border-radius:8px;background:#fff;padding:6px;text-align:center;cursor:grab;font-size:12px;overflow-wrap:anywhere}.thumb.selected{border-color:#477be1}.thumb img{display:block;width:100%;height:190px;object-fit:contain;background:#f8f8f8}.thumb input{position:absolute;left:10px;top:10px;z-index:1}.zoom{position:absolute;right:10px;top:8px}.setting{padding:12px 0;border-bottom:1px solid #e7e9eb}.setting select,.setting input:not([type=checkbox]){width:100%;padding:9px;border:1px solid #cfd4da;border-radius:6px;background:#fff}.changed h3:after{content:' · Modified';color:#377bd4;font-size:11px}.actions{padding-top:14px}button{font:inherit}.primary,.download{width:100%;padding:10px;border:0;border-radius:7px;cursor:pointer}.primary{background:#377bd4;color:white}.download{display:none;margin-top:9px;background:#24834d;color:white}.download.show{display:block}.status{min-height:20px;margin-top:9px;font-size:12px}.status.error{color:#c62828}.status.ok{color:#168044}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;align-items:center;justify-content:center;padding:30px}.modal.show{display:flex}.modal img{max-width:96vw;max-height:92vh;width:auto;height:auto;background:white;image-rendering:auto}.modal button{position:absolute;right:20px;top:12px;font-size:30px;background:none;border:0;color:white}@media(max-width:850px){body{height:auto;min-height:100vh;overflow:auto}.workspace{height:auto;grid-template-columns:1fr}.files{max-height:280px}.preview-box{height:55vh;min-height:360px}.settings{max-height:none}}
</style><main><section class="workspace"><aside class="files"><div class="upload" id="uploadArea"><strong>Click or drag PDF files here</strong><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple></div><div class="memory" id="loadStatus" role="status"><span id="loadStatusText">Waiting…</span><div class="upload-progress" aria-hidden="true"><i id="uploadProgressBar"></i></div></div><div class="memory"><b>Selected file size</b><br><span id="memoryText">0 B / 500 MB</span><div class="memory-bar"><i id="memoryBar"></i></div></div><h3>Uploaded files</h3><div class="file-list" id="fileList"><div class="hint">暂无文件</div></div></aside><div class="preview-box"><div class="preview-head"><span>Page preview</span><span id="pageCount">0 pages</span></div><div class="preview" id="preview"><div class="help">请从左侧上传 PDF 文件</div></div><div class="help" style="margin-top:8px;flex:none">Click thumbnails to select or deselect; drag to reorder.</div></div><div class="settings"><div class="setting" id="sizeSetting"><h3>Page size</h3><select id="pageSize"><option value="original">Original size (unchanged)</option><option value="A4">A4 (210 × 297 mm)</option><option value="A3">A3 (297 × 420 mm)</option></select></div><div class="setting" id="pagesSetting"><h3>Keep pages</h3><input id="pages" placeholder="Unchanged; e.g. 1 3-5"><div class="help">Leave blank to keep all pages.</div></div><div class="setting"><h3>Compress PDF</h3><div class="help">Removed: files are not uploaded or compressed.</div></div><div class="actions"><button class="primary" id="processBtn">Apply settings and prepare download</button><div class="status" id="status"></div><button class="download" id="downloadBtn">Download processed PDF</button></div></div></section></main><div class="modal" id="modal"><button id="closeModal">×</button><img id="largeImage"></div>
<script type="module" src="./src/main.js"></script></body></html>
